<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holiday Effects CDN - Master Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #ffd600;
        --accent: #ff5252;
        --bg: #0a0a0a;
        --panel-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --tab-active: rgba(255, 255, 255, 0.15);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
        display: flex;
        height: 100vh;
      }

      #dashboard {
        position: relative;
        z-index: 1000000;
        width: 400px;
        height: 100%;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-right: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
      }

      .header {
        padding: 30px 30px 10px 30px;
      }

      h1 {
        font-family: "Outfit", sans-serif;
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(45deg, var(--primary), #ffffff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        font-size: 11px;
        opacity: 0.5;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 4px;
      }

      /* Tabs Navigation */
      .tabs-nav {
        display: flex;
        padding: 10px 20px;
        gap: 5px;
        border-bottom: 1px solid var(--glass-border);
      }

      .tab-btn {
        flex: 1;
        padding: 10px 5px;
        font-size: 12px;
        font-weight: 600;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.3s;
      }

      .tab-btn.active {
        color: var(--primary);
        background: var(--tab-active);
      }

      /* Tabs Content */
      .tabs-content {
        flex: 1;
        overflow-y: auto;
        padding: 25px 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .tab-pane {
        display: none;
        flex-direction: column;
        gap: 20px;
        animation: fadeIn 0.3s ease;
      }

      .tab-pane.active {
        display: flex;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.8);
      }

      label span { color: var(--primary); font-family: monospace; }

      input[type="text"],
      input[type="number"],
      select,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        background: var(--panel-bg);
        border: 1px solid var(--glass-border);
        color: white;
        font-family: inherit;
        font-size: 14px;
        transition: all 0.2s;
      }

      input:focus, select:focus {
        border-color: var(--primary);
        outline: none;
        background: rgba(255, 255, 255, 0.1);
      }

      .btn-primary {
        background: var(--primary);
        color: #000;
        font-weight: 700;
        border: none;
        cursor: pointer;
        margin-top: 10px;
      }

      .btn-primary:hover {
        background: #fff;
        transform: translateY(-2px);
      }

      .code-output {
        background: #000;
        padding: 15px;
        border-radius: 8px;
        font-size: 11px;
        border: 1px dashed var(--glass-border);
        position: relative;
        margin-top: 10px;
      }

      .copy-badge {
        position: absolute;
        top: -10px;
        right: 10px;
        background: var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
      }

      .footer {
        padding: 20px;
        font-size: 10px;
        opacity: 0.3;
        text-align: center;
        border-top: 1px solid var(--glass-border);
      }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="dashboard">
      <div class="header">
        <h1>Holiday Master</h1>
        <div class="subtitle">CDN v3.0 • Unified Control</div>
      </div>

      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="visual">🎨 HIỆU ỨNG</button>
        <button class="tab-btn" data-tab="tracker">📈 TRACKER</button>
        <button class="tab-btn" data-tab="deploy">🔌 CÀI ĐẶT</button>
      </div>

      <div class="tabs-content">
        <!-- Tab: Visual -->
        <div class="tab-pane active" id="tab-visual">
          <div class="control-group">
            <label>Chủ đề mùa lễ</label>
            <select id="effect-type">
              <option value="victory">🇻🇳 30/04 Giải Phóng</option>
              <option value="tet">🧧 Tết Nguyên Đán</option>
              <option value="lixi">💰 Lì xì May mắn</option>
              <option value="valentine">💖 Valentine</option>
              <option value="noel">❄️ Giáng Sinh</option>
            </select>
          </div>

          <div class="control-group">
            <label>Mật độ hạt <span id="val-count">50</span></label>
            <input type="range" id="input-count" min="10" max="150" value="50" style="width:100%; accent-color: var(--primary);" />
          </div>

          <div class="control-group">
            <label>Tốc độ <span id="val-speed">1.0</span></label>
            <input type="range" id="input-speed" min="0.5" max="3.0" step="0.1" value="1.0" style="width:100%; accent-color: var(--primary);" />
          </div>

          <div class="control-group">
            <label>Trạng thái Banner</label>
            <button id="toggle-banner">BANNER: OFF</button>
          </div>
        </div>

        <!-- Tab: Tracker -->
        <div class="tab-pane" id="tab-tracker">
          <div class="control-group">
            <label>Hotline (Call)</label>
            <input type="text" id="tracker-hotline" placeholder="1900 9365" value="1900 9365" />
          </div>
          
          <div class="control-group">
            <label>Zalo Link</label>
            <input type="text" id="tracker-zalo" placeholder="https://zalo.me/..." value="https://zalo.me/auto365" />
          </div>

          <div class="control-group">
            <label>Google Sheets Script URL</label>
            <input type="text" id="tracker-gsheet" style="font-size: 10px;" value="https://script.google.com/macros/s/.../exec" />
          </div>

          <div class="control-group">
            <label>Website ID (Tự động)</label>
            <input type="text" id="tracker-webid" readonly value="auto365.vn" />
          </div>
        </div>

        <!-- Tab: Deploy -->
        <div class="tab-pane" id="tab-deploy">
            <p style="font-size: 12px; opacity: 0.7;">Nhúng mã này vào thẻ <code>&lt;head&gt;</code> của mọi website:</p>
            <div class="code-output">
                <span class="copy-badge" onclick="copyEmbed()">COPY</span>
                <pre id="embed-code">&lt;script src="https://cdn.auto365.com.vn/effects/loader.js"&gt;&lt;/script&gt;</pre>
            </div>
            
            <p style="font-size: 11px; color: var(--accent); margin-top: 10px;">
                ⚠️ Lưu ý: File <code>loader.js</code> sẽ tự động nạp các module cần thiết dựa trên cấu hình server.
            </p>
        </div>

        <button id="save-sync" class="btn-primary">LƯU & ĐỒNG BỘ TOÀN CDN</button>
      </div>

      <div class="footer">
        POWERED BY ANTIGRAVITY AI • 2026
      </div>
    </div>

    <!-- Modular Script Integration -->
    <script src="dist/core.min.js"></script>
    <script src="dist/tracker.min.js"></script>
    <script>
      // 1. Tab Logic
      document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
              document.querySelectorAll('.tab-btn, .tab-pane').forEach(el => el.classList.remove('active'));
              btn.classList.add('active');
              document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
          });
      });

      // 2. Config & Manager Logic
      const config = {
        effect: "victory",
        count: 50,
        speedMult: 1.0,
        banner: { enabled: false }
      };

      // Đồng bộ UI ban đầu
      const elType = document.getElementById("effect-type");
      const elCount = document.getElementById("input-count");
      const elSpeed = document.getElementById("input-speed");
      const btnBanner = document.getElementById("toggle-banner");

      function updateDashboard() {
        if (window.HolidayEffects) {
            HolidayEffects.update({
                effect: elType.value,
                count: parseInt(elCount.value),
                speedMult: parseFloat(elSpeed.value),
                banner: { enabled: btnBanner.innerText.includes("ON") }
            });
        }
        document.getElementById("val-count").innerText = elCount.value;
        document.getElementById("val-speed").innerText = elSpeed.value;
      }

      elType.addEventListener("change", updateDashboard);
      elCount.addEventListener("input", updateDashboard);
      elSpeed.addEventListener("input", updateDashboard);
      
      btnBanner.addEventListener("click", () => {
        const isOff = btnBanner.innerText.includes("OFF");
        btnBanner.innerText = isOff ? "BANNER: ON" : "BANNER: OFF";
        btnBanner.style.borderColor = isOff ? "var(--primary)" : "var(--glass-border)";
        updateDashboard();
      });

      // 3. Init Engine
      if (window.HolidayEffects) {
          HolidayEffects.init(config);
      }

      // 4. Save Logic
      document.getElementById("save-sync").addEventListener("click", function() {
        const btn = this;
        btn.innerText = "⏳ ĐANG ĐỒNG BỘ...";
        
        const finalConfig = {
            ...config,
            effect: elType.value,
            count: parseInt(elCount.value),
            speedMult: parseFloat(elSpeed.value),
            banner: { enabled: btnBanner.innerText.includes("ON") },
            tracker: {
                hotline: document.getElementById("tracker-hotline").value,
                zalo: document.getElementById("tracker-zalo").value,
                gsheet: document.getElementById("tracker-gsheet").value
            }
        };

        console.log("Saving complete config:", finalConfig);
        
        setTimeout(() => {
          btn.innerText = "✅ THÀNH CÔNG!";
          btn.style.background = "#4CAF50";
          setTimeout(() => {
            btn.innerText = "LƯU & ĐỒNG BỘ TOÀN CDN";
            btn.style.background = "var(--primary)";
          }, 2000);
        }, 1500);
      });

      function copyEmbed() {
          navigator.clipboard.writeText(document.getElementById('embed-code').innerText);
          alert("Đã sao chép mã nhúng!");
      }
    </script>
  </body>
</html>
